server:
  port: 8080
spring:
  application:
    name: "AUTENTICACION"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
adapters:
  r2dbc:
    host: "localhost"
    port: "5432"
    database: "postgres"
    schema: "crediya"
    username: "postgres"
    password: "postgres"
  transaction:
    reactive:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
jwt:
  tk:
    key: "jWdLDCLzz51gKYlojoRF5dE0S1KgNP1rqj4Zaau6Rwg="
    expiration: 3600000
